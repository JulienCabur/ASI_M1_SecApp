# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name localhost;
    server_tokens off;

    # TLS certificates from PKI
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS hardening
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    set $csp_nonce $request_id;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self' https://localhost:8443; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data:; frame-src blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve the frontend
    root /usr/share/nginx/html;
    index index.html;

    # SPA: fallback to index.html for client-side routing
    # Cache-Control: no-store is mandatory here: the per-request nonce is embedded
    # in the HTML body (meta tag) AND in the CSP header. If the browser caches the
    # HTML body and nginx generates a new nonce on the next request, the nonces
    # diverge and all Ant Design <style> injections are blocked.
    location / {
        try_files $uri $uri/ /index.html;
        sub_filter_once off;
        sub_filter 'NONCE_PLACEHOLDER' $csp_nonce;
        # Replicate server-level security headers (add_header in a location block
        # overrides all parent add_header directives in nginx).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self' https://localhost:8443; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data:; frame-src blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-store" always;
    }

    # Cache static assets (hashed filenames — safe to cache permanently)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /fastapi/ {
        client_max_body_size 100m;

        rewrite ^/fastapi/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Path /fastapi;
        proxy_set_header X-Script-Name /fastapi;
    }
    location = /openapi.json {
        rewrite ^ /fastapi/openapi.json permanent;
    }

    location = /docs {
        rewrite ^ /fastapi/docs permanent;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
