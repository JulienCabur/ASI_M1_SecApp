[ req ]
default_bits            = 2048
encrypt_key             = yes
default_md              = sha256
utf8                    = yes
string_mask             = utf8only
prompt                  = yes        
distinguished_name      = identity_dn
req_extensions          = identity_reqext

[ identity_dn ]

0.domainComponent       = "1. Domain Component (be)"
0.domainComponent_default = "be"

1.domainComponent       = "2. Domain Component (healthapp)"
1.domainComponent_default = "healthapp"

organizationName        = "3. Organization Name"
organizationName_default = "Health Application"

commonName              = "4. Common Name (Nom du Docteur)"
commonName_max          = 64

[ identity_reqext ]
keyUsage                = critical,nonRepudiation,digitalSignature,keyEncipherment
extendedKeyUsage        = clientAuth
subjectKeyIdentifier    = hash