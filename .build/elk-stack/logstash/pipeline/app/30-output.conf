output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    index => "security-audit-%{+YYYY.MM.dd}"
    action => "create"
    ssl_enabled => true
    ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca-chain.pem"
  }

  # Affiche les logs dans la console Docker pour t'aider au débogage
  stdout { codec => rubydebug }
}