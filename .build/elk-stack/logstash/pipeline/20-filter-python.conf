filter {
  if [session_id] and [encrypted_key] and [iv] and [tag] and [payload] {
    ruby {
      init => "
        require 'openssl'
        require 'base64'
        require 'json'

        key_path = '/usr/share/logstash/config/certs/server.key' 
        @private_key = OpenSSL::PKey::RSA.new(File.read(key_path))
        
        @@key_cache ||= {}
        @@cache_mutex ||= Mutex.new
      "
      code => "
        begin
          session_id = event.get('session_id')
          
          iv_bytes = Base64.strict_decode64(event.get('iv')).b
          tag_bytes = Base64.strict_decode64(event.get('tag')).b
          enc_payload_bytes = Base64.strict_decode64(event.get('payload')).b

          aes_key = nil

          @@cache_mutex.synchronize do
            if @@key_cache.key?(session_id)
              aes_key = @@key_cache[session_id]
            else
              enc_key_bytes = Base64.strict_decode64(event.get('encrypted_key')).b
              aes_key = @private_key.private_decrypt(enc_key_bytes, OpenSSL::PKey::RSA::PKCS1_PADDING)
              @@key_cache[session_id] = aes_key
              @@key_cache.shift if @@key_cache.size > 50
            end
          end

          cipher = OpenSSL::Cipher.new('aes-256-gcm')
          cipher.decrypt
          cipher.key = aes_key
          cipher.iv = iv_bytes
          cipher.auth_data = ''
          cipher.auth_tag = tag_bytes
          
          decrypted_json = cipher.update(enc_payload_bytes) + cipher.final
          parsed_log = JSON.parse(decrypted_json)
          
          parsed_log.each do |k, v|
            if k == '@timestamp'
              event.set('backend_timestamp_str', v)
            else
              event.set(k, v)
            end
          end

          event.remove('session_id')
          event.remove('encrypted_key')
          event.remove('iv')
          event.remove('tag')
          event.remove('payload')
          
        rescue => e
          event.tag('_decrypt_failure')
          event.set('cryptography_error', e.message)
        end
      "
    }
  }

  if !("_decrypt_failure" in [tags]) {
    
    if ![audit_chain][sequence] or ![audit_chain][hash] {
      mutate { add_tag => ["alerte_integrite_manquante"] }
    }

    mutate {
      add_field => {
        "raw_string_for_hash" => "%{backend_timestamp_str}%{[log][level]}%{[service][name]}%{[event][action]}%{[user][id]}%{[user][roles][0]}%{[user][roles][0]}%{[source][ip]}%{[patient][id]}%{[audit_chain][sequence]}%{[audit_chain][previous_hash]}"
      }
    }

    fingerprint {
      method => "SHA256"
      source => "raw_string_for_hash"
      target => "logstash_calculated_hash"
    }

    if [audit_chain][hash] and [logstash_calculated_hash] {
      if [audit_chain][hash] != [logstash_calculated_hash] {
        mutate { add_tag => ["ALERTE_FALSIFICATION_HASH"] }
      }
    }

    date {
      match => ["backend_timestamp_str", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      remove_field => ["logstash_calculated_hash", "raw_string_for_hash", "backend_timestamp_str"]
    }
  }
}