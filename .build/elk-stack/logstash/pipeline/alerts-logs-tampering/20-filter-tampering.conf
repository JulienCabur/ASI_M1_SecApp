filter {
  if [user.name] in ["logstash_internal", "logstash_alerts_writer", "kibana_system", "_system"] {
    drop {}
  }

  if [event.action] != "access_granted" {
    drop {}
  }

  if [request.name] not in ["DeleteRequest", "DeleteIndexRequest", "BulkRequest", "UpdateRequest"] {
    drop {}
  }

  # Surveille les deux index applicatifs : audit sécurité ET opérations fichiers
  if ![indices] or (
    [indices][0] !~ /^security-audit-/ and
    [indices][0] !~ /^file-operations-/
  ) {
    drop {}
  }

  mutate {
    add_field => {
      "alert_type"        => "LOG_TAMPERING"
      "alert_severity"    => "CRITICAL"
      "alert_description" => "Modification ou suppression detectee sur un index de logs applicatifs (security-audit-* ou file-operations-*)"
    }
    remove_field => ["@version", "host"]
  }
}
