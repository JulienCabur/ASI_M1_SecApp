output {
  if [log_category] == "file_operation" {
    elasticsearch {
      hosts     => ["https://elasticsearch:9200"]
      user      => "logstash_internal"
      password  => "${LOGSTASH_INTERNAL_PASSWORD}"
      index     => "file-operations-%{+YYYY.MM.dd}"
      action    => "create"
      ssl_enabled                 => true
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca-chain.pem"
    }
  } else {
    elasticsearch {
      hosts     => ["https://elasticsearch:9200"]
      user      => "logstash_internal"
      password  => "${LOGSTASH_INTERNAL_PASSWORD}"
      index     => "security-audit-%{+YYYY.MM.dd}"
      action    => "create"
      ssl_enabled                 => true
      ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca-chain.pem"
    }
  }

  stdout { codec => rubydebug }
}
