filter {
  # Le fichier d'audit ES produit des clés JSON plates avec des points (ex: "event.action")
  # => on utilise la notation [champ.avec.point], PAS [champ][sous-champ]

  # Ignorer les comptes de service légitimes (leurs writes dans security-audit-* sont normaux)
  if [user.name] in ["logstash_internal", "logstash_alerts_writer", "kibana_system", "_system"] {
    drop {}
  }

  # Ne garder que les opérations qui ont réussi
  if [event.action] != "access_granted" {
    drop {}
  }

  # Ne garder que les opérations destructives sur des documents ou des indices
  if [request.name] not in ["DeleteRequest", "DeleteIndexRequest", "BulkRequest", "UpdateRequest"] {
    drop {}
  }

  # Ne conserver que les actions sur nos indices de logs applicatifs
  if ![indices] or [indices][0] !~ /^security-audit-/ {
    drop {}
  }

  mutate {
    add_field => {
      "alert_type"        => "LOG_TAMPERING"
      "alert_severity"    => "CRITICAL"
      "alert_description" => "Modification ou suppression detectee sur un index de logs applicatifs"
    }
    remove_field => ["@version", "host"]
  }
}
