---
## Default Elasticsearch configuration from Elasticsearch base image.
## https://github.com/elastic/elasticsearch/blob/main/distribution/docker/src/docker/config/elasticsearch.yml
#
cluster.name: docker-cluster
network.host: 0.0.0.0

xpack.license.self_generated.type: trial
xpack.security.enabled: true

## HTTPS – couche HTTP (API REST)
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/server.crt
xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/server.key
xpack.security.http.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca-chain.pem

## TLS – couche transport (communication inter-nœuds)
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/server.crt
xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/server.key
xpack.security.transport.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca-chain.pem

## Audit Logging - détection de tampering des logs applicatifs
## access_granted capture toutes les opérations qui réussissent (y compris les suppressions)
## Le filtrage fin (action, index, user) est géré côté Logstash (20-filter.conf)
xpack.security.audit.enabled: true
xpack.security.audit.logfile.events.include:
  - "access_granted"
